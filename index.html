    <!-- ==================== FIREBASE SDK (compat — optimized) ==================== -->
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
    <script>
      const FIREBASE_CONFIG = {
        apiKey:            "AIzaSyBOfuPVR5fns4c0EFM9uyO0og0ZvlySAe4",
        authDomain:        "understate-62919.firebaseapp.com",
        projectId:         "understate-62919",
        storageBucket:     "understate-62919.firebasestorage.app",
        messagingSenderId: "1005888565298",
        appId:             "1:1005888565298:android:30da582e4c434e9652cc2b"
      };

      window._fbAuthBypass = false;

      const GAME_ID     = "understate_main_server";
      const LOCAL_ONLY_KEYS = ["sessionUserId","theme","sidebarCollapsed","positionTasks","examResults","dailyStreak","dailyTasks","gnkVote_"];
      const REALTIME_KEYS = ["globalChat","cityChats","parliamentMsgs","supportMsgs","liveNews","announcements","activityFeed","users"];
      const LOG_KEYS      = ["casinoLogs","activityLog","historyLog","liveFeed","socialPosts","newspapers","randomEvents","scandals","netWorthHistory"];

      firebase.initializeApp(FIREBASE_CONFIG);
      const _db   = firebase.firestore();
      
      // Optimized persistence settings
      _db.enablePersistence({ synchronizeTabs: true }).catch(e => {
        if (e.code === 'failed-precondition') {
          console.log("[Firebase] Multiple tabs detected");
        } else if (e.code === 'unimplemented') {
          console.log("[Firebase] Browser doesn't support persistence");
        }
      });
      
      // Optimize Firestore for faster queries
      _db.settings({
        cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED
      });
      
      const _auth = firebase.auth();

      window._gameId        = GAME_ID;
      window._rtKeys        = REALTIME_KEYS;
      window._logKeys       = LOG_KEYS;
      window._localOnlyKeys = LOCAL_ONLY_KEYS;
      window._fbReady       = false;
      window._activeListeners = [];

      window._fb = {
        db: _db,
        setDoc: (ref, data, opts) => opts && opts.merge ? ref.set(data, {merge:true}) : ref.set(data),
        getDoc: (ref) => ref.get(),
        doc: (db, ...path) => {
          let ref = db;
          for(let i=0; i<path.length; i++) {
            ref = (i%2===0) ? ref.collection(path[i]) : ref.doc(path[i]);
          }
          return ref;
        },
        onSnapshot: (ref, cb) => ref.onSnapshot(cb),
        serverTimestamp: () => firebase.firestore.FieldValue.serverTimestamp()
      };

      async function initFirebaseData() {
        try {
          try {
            const currentUser = _auth.currentUser;
            if (currentUser) {
              window._fbUid = currentUser.uid;
              console.log("[Firebase] Session restored:", window._fbUid);
            } else {
              const anonUser = await _auth.signInAnonymously();
              window._fbUid = anonUser.user.uid;
              console.log("[Firebase] Anonymous login successful:", window._fbUid);
            }
          } catch(authErr) {
            window._fbUid = "anon_" + Math.random().toString(36).substr(2, 9);
            console.warn("[Firebase] Anonymous login failed, continuing:", authErr.message);
          }
          
          console.log("[Firebase] Connecting to Firestore...");

          const gameRef  = _db.collection("games").doc(GAME_ID).collection("state").doc("main");
          const gameSnap = await gameRef.get();

          if (gameSnap.exists) {
            const data = gameSnap.data();
            const syncKeys = [];
            Object.entries(data).forEach(([k, v]) => {
              if (k === "_meta") return;
              if (LOCAL_ONLY_KEYS.some(lk => k === lk || k.startsWith(lk))) return;
              try { localStorage.setItem("rep_" + k, JSON.stringify(v)); syncKeys.push([k,v]); } catch(e) {}
            });
            console.log("[Firebase] Data loaded:", syncKeys.length, "keys");
            setTimeout(() => {
              syncKeys.forEach(([k,v]) => {
                window.dispatchEvent(new CustomEvent("fb-sync", { detail: { key: k, value: v } }));
              });
            }, 100); // Reduced delay from 500ms to 100ms
          } else {
            console.log("[Firebase] Initial startup — using local data");
          }

          setupRealtimeListeners();

          window._fbReady = true;
          window.dispatchEvent(new Event("firebase-ready"));

        } catch(e) {
          console.warn("[Firebase] Connection error, continuing offline:", e.message);
          window._fbReady = false;
          window.dispatchEvent(new Event("firebase-ready"));
        }
      }

      function setupRealtimeListeners() {
        // OPTIMIZED: Multiple fast listeners instead of one slow one
        const rtRef = _db.collection("games").doc(GAME_ID).collection("realtime").doc("shared");
        
        const listener = rtRef.onSnapshot(
          { includeMetadataChanges: false }, // Disable metadata changes for speed
          (snap) => {
            if (!snap.exists) return;
            const data = snap.data();
            
            Object.entries(data).forEach(([k, v]) => {
              if (!REALTIME_KEYS.includes(k)) return;
              if (LOCAL_ONLY_KEYS.some(lk => k === lk || k.startsWith(lk))) return;
              try {
                const curr     = localStorage.getItem("rep_" + k);
                const incoming = JSON.stringify(v);
                if (curr !== incoming) {
                  localStorage.setItem("rep_" + k, incoming);
                  // Dispatch event immediately without delay
                  window.dispatchEvent(new CustomEvent("fb-sync", { detail: { key: k, value: v } }));
                }
              } catch(e) {}
            });
          },
          (error) => {
            console.warn("[Firebase] Listener error:", error.message);
          }
        );
        
        window._activeListeners.push(listener);
      }

      initFirebaseData();
    </script>

    <!-- ==================== FIREBASE SAVE HELPER ==================== -->
    <script>
      window._fbPendingWrites = {};
      window._fbFlushTimer    = null;

      // OPTIMIZED: Reduced debounce from 3s to 1s for faster saves
      window._fbFlush = function() {
        if (!window._fb || !window._fbReady) return;
        const pending = {...window._fbPendingWrites};
        window._fbPendingWrites = {};
        if (!Object.keys(pending).length) return;

        const { db, doc, setDoc, serverTimestamp } = window._fb;

        const rtData    = {};
        const stateData = { _meta: { lastSave: Date.now() } };

        Object.entries(pending).forEach(([k, v]) => {
          if (window._rtKeys && window._rtKeys.includes(k)) {
            rtData[k] = v;
          } else {
            stateData[k] = v;
          }
        });

        if (Object.keys(stateData).length > 1) {
          setDoc(doc(db, "games", window._gameId, "state", "main"), stateData, { merge: true })
            .catch(e => console.warn("[Firebase] State write error:", e.message));
        }
        if (Object.keys(rtData).length) {
          setDoc(doc(db, "games", window._gameId, "realtime", "shared"), rtData, { merge: true })
            .catch(e => console.warn("[Firebase] Realtime write error:", e.message));
        }
      };

      window._fbScheduleFlush = function() {
        if (window._fbFlushTimer) clearTimeout(window._fbFlushTimer);
        window._fbFlushTimer = setTimeout(window._fbFlush, 1000); // Changed from 3000ms to 1000ms
      };
    </script>

.tag-gold {background:rgba(251,186,69,0.1);  color:var(--gold); border:1px solid rgba(251,186,69,0.25)}
.tag-green{background:rgba(16,217,160,0.1);  color:var(--green);border:1px solid rgba(16,217,160,0.25)}
.tag-blue {background:rgba(var(--accent-rgb),0.1);color:var(--accent);border:1px solid rgba(var(--accent-rgb),0.25)}
.tag-gray {background:var(--input-bg);color:var(--text-dim);border:1px solid var(--border2)}

/* ── BUTONLAR ────────────────────────────────────── */
.btn{width:100%;padding:0.75rem 1rem;border:none;border-radius:13px;
  font-family:'DM Sans',sans-serif;font-weight:800;font-size:0.88rem;
  letter-spacing:0.04em;cursor:pointer;transition:all 0.18s ease;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(255,255,255,0.06),transparent);
  pointer-events:none;border-radius:inherit}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;box-shadow:0 4px 16px rgba(var(--accent-rgb),0.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(var(--accent-rgb),0.4)}
.btn-primary:active{transform:translateY(0)}
.btn-white{background:#fff;color:#0D1C35;box-shadow:var(--shadow-sm)}
.btn-white:hover{background:#f4f6f9;transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#07101F;
  font-weight:900;box-shadow:0 4px 16px rgba(251,186,69,0.3)}
.btn-gold:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;
  box-shadow:0 4px 16px rgba(16,217,160,0.3)}
.btn-green:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-blue{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;
  box-shadow:0 4px 16px rgba(var(--accent-rgb),0.3)}
.btn-blue:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-red{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;
  box-shadow:0 4px 16px rgba(242,82,82,0.3)}
.btn-red:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-gray{background:var(--input-bg);color:var(--text);border:1px solid var(--border2)}
.btn-gray:hover{background:rgba(var(--accent-rgb),0.08);border-color:rgba(var(--accent-rgb),0.3)}
.btn-sm{padding:0.38rem 0.85rem;font-size:0.8rem;width:auto;border-radius:9px;font-weight:700}
.btn-sm::after{display:none}
.btn:disabled{opacity:0.45;cursor:not-allowed;transform:none!important}

.oauth-row{display:flex;gap:0.5rem;margin-bottom:1rem}
.btn-oauth{flex:1;padding:0.65rem;border-radius:10px;border:1px solid var(--border2);
  background:var(--input-bg);color:var(--text-dim);font-family:'DM Sans',sans-serif;
  font-size:0.82rem;cursor:pointer;transition:all 0.18s}
.btn-oauth:hover{background:rgba(var(--accent-rgb),0.08);color:var(--text);border-color:rgba(var(--accent-rgb),0.3)}

/* ── FORMLAR ─────────────────────────────────────── */
.form-group{margin-bottom:1rem}
.form-input,.form-select{width:100%;padding:0.75rem 0.9rem;background:var(--input-bg);
  border:1px solid var(--input-border);border-radius:12px;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:0.92rem;transition:all 0.2s;outline:none}
.form-input:focus{border-color:rgba(var(--accent-rgb),0.6);background:rgba(var(--accent-rgb),0.05);
  box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.12)}
.form-input::placeholder{color:var(--text-muted)}
.form-select{cursor:pointer;-webkit-appearance:none}
.form-select:focus{border-color:rgba(var(--accent-rgb),0.6);box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.1)}
.tab-row{display:flex;background:var(--input-bg);border-radius:13px;padding:3px;margin-bottom:1rem;gap:2px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:0.45rem;border-radius:10px;border:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-weight:800;font-size:0.82rem;
  transition:all 0.15s ease;letter-spacing:0.02em;background:transparent;color:var(--text-muted)}
.tab-btn.active{background:rgba(var(--accent-rgb),0.15);color:var(--accent)}
.tab-btn:not(.active):hover{color:var(--text);background:rgba(var(--accent-rgb),0.06)}

/* ── GİRİŞ SAYFASI ───────────────────────────────── */
.login-wrap{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:1.5rem;background:var(--body-bg);
  overflow:hidden;transition:background 0.35s}
.login-wrap::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 30%,rgba(var(--accent-rgb),0.07) 0%,transparent 65%);
  pointer-events:none;transition:background 0.35s}
.login-card{width:100%;max-width:420px;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:22px;padding:clamp(1.5rem,4vw,2.2rem);box-shadow:var(--shadow-lg)}

/* ── MODAL ───────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:1rem;
  animation:fadeIn 0.2s ease;backdrop-filter:blur(6px)}
.modal{background:var(--card-bg);border:1px solid var(--card-border);border-radius:22px;
  padding:1.75rem;width:100%;max-width:430px;box-shadow:var(--shadow-lg);
  transition:background 0.35s,border-color 0.35s;animation:materialize 0.25s ease}
.modal-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:var(--accent);
  margin-bottom:1.25rem;letter-spacing:0.06em;text-transform:uppercase}
.modal-btns{display:flex;gap:0.75rem;margin-top:1.75rem}

/* ── BİLDİRİM ────────────────────────────────────── */
.notification{position:fixed;top:72px;right:1rem;background:var(--card-bg);
  border:1px solid rgba(var(--accent-rgb),0.28);border-left:3px solid var(--accent);
  border-radius:13px;padding:0.8rem 1.2rem;z-index:600;min-width:250px;
  animation:fadeIn 0.25s ease;font-size:0.9rem;font-weight:700;color:var(--text);
  box-shadow:var(--shadow-lg),0 0 20px rgba(var(--accent-rgb),0.1);backdrop-filter:blur(20px)}

/* Quick styles for mobile responsiveness */
@media(max-width:900px){
  .app-wrap{padding-bottom:68px;overflow-x:hidden}
  .header{padding:0.5rem 0.85rem}
  .sidebar-nav{display:none!important}
  .sidebar-layout{display:block!important}
  .content{padding:0.65rem 0.7rem;padding-bottom:130px!important}
}
    </style>

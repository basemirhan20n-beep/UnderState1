    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* MOBİL KAYIT VE TAM EKRAN FIX */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0A1628;

        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        /* Kayıt sayfası ve formların mobilde klavye açılınca kaybolmaması için */
        .auth-container, .register-page {
            height: 100vh;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 80px;
        }
        input, select, textarea {
            font-size: 16px !important; /* iOS otomatik zoom engelleme */
        }
    </style>

    <script>
    (function(){
      const FIREBASE_CONFIG = {
        apiKey:            "AIzaSyBOfuPVR5fns4c0EFM9uyO0og0ZvlySAe4",
        authDomain:        "understate-62919.firebaseapp.com",
        projectId:         "understate-62919",
        storageBucket:     "understate-62919.firebasestorage.app",
        messagingSenderId: "1005888565298",
        appId:             "1:1005888565298:android:30da582e4c434e9652cc2b",
        databaseURL:       "https://understate-62919-default-rtdb.europe-west1.firebasedatabase.app"
      };

      window._fbAuthBypass = true;
      const GAME_ID       = "understate_main_server"; // Cihazlar arası senkronizasyon için sabit ID
      const REALTIME_KEYS = ["globalChat","cityChats","parliamentMsgs","supportMsgs","liveNews","announcements","activityFeed"];

      firebase.initializeApp(FIREBASE_CONFIG);
      const _db   = firebase.firestore();
      const _rtdb = firebase.database();

      window._gameId  = GAME_ID;
      window._rtKeys  = REALTIME_KEYS;
      window._fbReady = false;

      window._fb = {
        db:              _db,
        rtdb:            _rtdb,
        setDoc:          (ref, data, opts) => opts && opts.merge ? ref.set(data, {merge:true}) : ref.set(data),
        getDoc:          (ref) => ref.get(),
        doc: (db, ...path) => {
          let ref = db;
          for (let i = 0; i < path.length; i++) {
            ref = (i % 2 === 0) ? ref.collection(path[i]) : ref.doc(path[i]);
          }
          return ref;
        },
        onSnapshot:      (ref, cb) => ref.onSnapshot(cb),
        serverTimestamp: () => firebase.firestore.FieldValue.serverTimestamp(),
        rtdbRef:         (path) => _rtdb.ref(path),
        rtdbUpdate:      (path, data) => _rtdb.ref(path).update(data),
        rtdbServerTime:  () => firebase.database.ServerValue.TIMESTAMP
      };

      /* RTDB Dönüşümü */
      function rtdbToJS(val) {
        if (val === null || val === undefined) return val;
        if (typeof val !== 'object' || Array.isArray(val)) return val;
        const keys = Object.keys(val);
        const allNumeric = keys.every(k => /^\d+$/.test(k));
        if (allNumeric) {
            return keys.sort((a,b) => Number(a)-Number(b)).map(k => rtdbToJS(val[k]));
        }
        const out = {};
        keys.forEach(k => { out[k] = rtdbToJS(val[k]); });
        return out;
      }

      /* SOHBET DİNLEYİCİSİ (Anlık Mesajlar İçin) */
      function setupChatListener() {
        const db = window._fb.db;
        // Mesajları tarihe göre azalan sırada dinle (Son 50 mesaj)
        db.collection("games").doc(GAME_ID).collection("messages")
          .orderBy("timestamp", "desc")
          .limit(50)
          .onSnapshot((snap) => {
            const msgs = [];
            snap.forEach(doc => msgs.push({id: doc.id, ...doc.data()}));
            localStorage.setItem("rep_messages", JSON.stringify(msgs.reverse()));
            window.dispatchEvent(new Event("chat-updated"));
            console.log("[Chat] Yeni mesajlar senkronize edildi ✓");
          }, (err) => console.warn("[Chat] Hata:", err.message));
      }

      /* Global Durum Dinleyicileri */
      function setupGlobalStateListeners() {
        const db = window._fb.db;
        db.collection("games").doc(GAME_ID).collection("global").doc("market")
          .onSnapshot((snap) => {
            if (!snap.exists) return;
            const data = snap.data();
            Object.entries(data).forEach(([k, v]) => {
                localStorage.setItem("rep_"+k, JSON.stringify(v));
                window.dispatchEvent(new CustomEvent("fb-sync", { detail: { key: k, value: v } }));
            });
          });

        db.collection("games").doc(GAME_ID).collection("global").doc("government")
          .onSnapshot((snap) => {
            if (!snap.exists) return;
            const data = snap.data();
            Object.entries(data).forEach(([k, v]) => {
                localStorage.setItem("rep_"+k, JSON.stringify(v));
                window.dispatchEvent(new CustomEvent("fb-sync", { detail: { key: k, value: v } }));
            });
          });
      }

      /* Başlatma */
      async function initFirebaseData() {
        // Cihaz bazlı anonim ID veya mevcut Auth ID
        window._fbUid = localStorage.getItem("us_uid") || "u_" + Math.random().toString(36).substr(2, 9);
        localStorage.setItem("us_uid", window._fbUid);

        setupGlobalStateListeners();
        setupChatListener(); // Sohbeti başlat
        
        window._fbReady = true;
        window.dispatchEvent(new Event("firebase-ready"));
        console.log("[UNDERSTATE] Real-time sistem hazır ✓");
      }

      initFirebaseData();
    })();
    </script>
</head>
<body>

<div id="root"></div>

<div id="loading-screen" style="position:fixed;inset:0;z-index:9999;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;font-family:'DM Sans',sans-serif;">
  <div style="font-family:'Syne',sans-serif;font-size:clamp(1.6rem,5vw,2.5rem);letter-spacing:0.35rem;display:flex;align-items:baseline;">
    <span style="color:#D00000;font-weight:900;text-shadow:0 0 20px rgba(208,0,0,0.8);">[U</span><span style="color:#fff;font-weight:900;">NDER</span><span style="color:#D00000;font-weight:900;">]</span>
  </div>
  <div id="loading-bar-wrap" style="width:200px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;">
    <div id="loading-bar" style="height:100%;width:0%;background:#D00000;border-radius:2px;box-shadow:0 0 10px #D00000;transition:width 0.4s ease;"></div>
  </div>
  <div id="loading-text" style="color:#555;font-size:0.8rem;letter-spacing:0.1rem;text-transform:uppercase;">Sistemler Eşitleniyor...</div>
  <div id="loading-error" style="display:none;color:#D00000;font-size:0.85rem;text-align:center;max-width:280px;line-height:1.6;"></div>
</div>

<script>
// ── Boot Script ────────────────────────────────────────────────────────
var _lb = document.getElementById('loading-bar');
var _lt = document.getElementById('loading-text');
function _advanceBar(p, t) { if(_lb) _lb.style.width = p + '%'; if (t && _lt) _lt.textContent = t; }

function boot() {
  _advanceBar(80, 'Oyun Başlatılıyor...');
  // Buradaki mantık src/app.js dosyanı yükleyip çalıştıracaktır
  // Mevcut boot fonksiyonunla devam edebilirsin.
  _advanceBar(100, 'Hazır');
  setTimeout(() => {
    const ls = document.getElementById('loading-screen');
    if(ls) ls.style.display = 'none';
  }, 500);
}

// React ve ReactDOM yüklendikten sonra boot'u çağır
window.addEventListener('load', boot);
</script>

<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

</body>
</html>
